</head>
<body>
        <header>

        <nav>
            <a href="index.html">Home</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="blogs.html">Blogs</a>

        <div class="logo">
        <a href="index.html">
        <img src="./img/Logo_pasteleria_mil_sabores.png" class="logo-img" >
        </a>
        <h1></h1>
        </div>
        <div class="carrito-acceso">
            <a href="carrito.html">🛒 Carrito (0)</a>
            <a href="login.html" class="btn-login">Iniciar sesión</a>
            <a href="registro.html" class="btn-registro">Registrar usuario</a>
        </div>
    </header>
    <main class="registro-main">
        <div class="titulo-pagina">
            <h1>Registro</h1>
            <p class="subtitulo">Regístrate con nosotros</p>
        </div>
        <div class="contenedor-registro">
            <form id="form-registro" novalidate>

                <div class="form-grupo">
                    <label for="nombre">Nombre Completo</label>
                    <div class="input-container">
                        <input type="text" id="nombre" maxlength="100" placeholder="Ingresa tu nombre completo">
                        <span class="error-msg" id="err-nombre"></span>
                    </div>
                </div>

                <div class="form-grupo">
                    <label for="password">Contraseña</label>
                    <div class="input-container">
                        <input type="password" id="password" placeholder="Mínimo 8 caracteres">
                        <span class="error-msg" id="err-password"></span>
                    </div>
                </div>

                <div class="form-grupo">
                    <label for="confirmar-password">Confirmar Contraseña</label>
                    <div class="input-container">
                        <input type="password" id="confirmar-password" placeholder="Repite tu contraseña">
                        <span class="error-msg" id="err-confirmar-password"></span>
                    </div>
                </div>

                <div class="form-grupo">
                    <label for="correo">Correo</label>
                    <div class="input-container">
                        <input type="email" id="correo" placeholder="ejemplo@duoc.cl">
                        <span class="error-msg" id="err-correo"></span>
                    </div>
                </div>

                <div class="form-grupo">
                    <label for="telefono">Teléfono</label>
                    <div class="input-container">
                        <input type="tel" id="telefono" maxlength="11" placeholder="56 9 1234 5678">
                        <span class="error-msg" id="err-telefono"></span>
                    </div>
                </div>

                <div class="form-grupo">
                    <label for="direccion">Dirección</label>
                    <div class="input-container">
                        <input type="text" id="direccion" maxlength="300" placeholder="Calle, número, depto">
                        <span class="error-msg" id="err-direccion"></span>
                    </div>
                </div>

                <div class="form-fila-ubicacion">
                        <div class="form-subgrupo">
                            <label for="comuna">Comuna</label>
                            <div class="input-container">
                                <select id="comuna">
                                    <option value="">Selecciona comuna</option>
                                    <option value="San Bernardo">San Bernardo</option>
                                    <option value="Santiago">Santiago</option>
                                    <option value="Providencia">Providencia</option>
                                </select>
                                <span class="error-msg" id="err-comuna"></span>
                            </div>
                        </div>

                        <div class="form-subgrupo">
                            <label for="region">Región</label>
                            <div class="input-container">
                                <select id="region">
                                    <option value="">Selecciona tu región</option>
                                    <option value="Metropolitana">Región Metropolitana</option>
                                    <option value="Valparaíso">Región de Valparaíso</option>
                                    <option value="Biobío">Región del Biobío</option>
                                </select>
                                <span class="error-msg" id="err-region"></span>
                            </div>
                        </div>
                </div>
                <div class="form-acciones">
                    <button type="submit" class="btn-registro-submit">Registrarse</button>
                </div>

            </form>
        </div>
    </main>

        <p>&copy; 2026 Pastelería Mil Sabores. Todos los derechos reservados.</p>
    </footer>

    <script src="js/registro.js"></script>
</body>
</html>

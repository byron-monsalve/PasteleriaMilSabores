<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastelería Mil Sabores - Iniciar Sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/svg+xml" href="./img/logo_web_2.png">
</head>
<body>

    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="blogs.html">Blogs</a>
            <a href="contacto.html">Contacto</a>
        </nav>

        <div class="logo">
            <a href="index.html">
                <img src="./img/Logo_pasteleria_mil_sabores.png" class="logo-img" alt="Logo">
            </a>
            <h1></h1>
        </div>

        <div class="carrito-acceso">
            <a href="carrito.html">🛒 Carrito (0)</a>
            <a href="login.html" class="btn-login">Iniciar sesión</a>
            <a href="registro.html" class="btn-registro">Registrar usuario</a>
        </div>
    </header>

    <main>
        <section class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card card-login shadow-sm border-0 rounded-3">
                        <div class="card-body p-4 p-sm-5">
                            <div   class="text-center mb-3"> 
                                <img src="./img/logo_sin_titulo.png" class="img-login-arriba">
                            </div>
                            <h2 class="text-center mb-4 titulo-login" >Iniciar Sesión</h2>
                            
                            <form id="formLogin" novalidate>
                                <div class="mb-3">
                                    <label for="form-control-mail" class="form-label">Correo electrónico</label>
                                    <input 
                                        type="email" 
                                        class="form-control form-control-pasteleria" 
                                        id="form-control-mail" 
                                        placeholder="ejemplo@duoc.cl"
                                        maxlength="100"
                                    >
                                    <div id="errorMail" class="text-danger small mt-1"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="form-control-password" class="form-label">Contraseña</label>
                                    <input 
                                        type="password" 
                                        class="form-control form-control-pasteleria" 
                                        id="form-control-password" 
                                        placeholder="Ingrese contraseña"
                                        minlength="4"
                                        maxlength="10"
                                    >
                                    <div id="errorPassword" class="text-danger small mt-1"></div>
                                </div>

                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input check-pasteleria" id="recordar">
                                        <label class="form-check-label small" for="recordar">Recordarme</label>
                                    </div>
                                    <a href="#" class="text-decoration-none small enlace-olvido">¿Olvidaste tu contraseña?</a>
                                </div>

                                <button type="submit" class="btn btn-login-submit w-100 py-2 mb-3">Iniciar sesión</button>

                                <div class="text-center mt-3">
                                    <span class="small text-muted">¿No tienes una cuenta? </span>
                                    <a href="registro.html" class="btn-registro-link fw-bold">Regístrate aquí</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Pastelería Mil Sabores. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
